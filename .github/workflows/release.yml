name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-22.04: aeltere glibc, damit die Datei auf moeglichst vielen Distributionen laeuft
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-gtk-3.0 pkg-config

      - name: Python packages
        run: pip install "PyGObject==3.48.2" pycairo pyinstaller

      - name: Build
        run: |
          pyinstaller --noconfirm --clean --onefile --name wow-forever-addon-manager \
            --add-data assets:assets \
            --hidden-import wfa_gui --hidden-import wfa_cli --hidden-import wfa_core \
            --hidden-import wfa_base --hidden-import wfa_paths --hidden-import wfa_http --hidden-import wfa_toc --hidden-import wfa_sources --hidden-import wfa_files --hidden-import wfa_pins \
            --hidden-import wfa_manager --hidden-import wfa_plan --hidden-import wfa_apply --hidden-import wfa_savedvars --hidden-import wfa_assign \
            --hidden-import wfa_tray --hidden-import wfa_background --hidden-import wfa_newaddon --hidden-import wfa_selfupdate \
            --hidden-import wfa_portal --hidden-import wfa_i18n --hidden-import wfa_expert --hidden-import wfa_chars --hidden-import wfa_cleanup --hidden-import wfa_snapshot \
            --hidden-import wfa_unattended --hidden-import wfa_bugs --hidden-import wfa_sets --hidden-import wfa_health \
            wow-forever-addon-manager.py

      - name: Smoke test
        env:
          WOW_FA_HOME: ${{ runner.temp }}/wfa-home
        run: |
          ./dist/wow-forever-addon-manager --version
          ./dist/wow-forever-addon-manager --help
          # Uebersetzungskatalog liegt in der Datei
          WFA_LANG=en ./dist/wow-forever-addon-manager --help | grep -q "Addon manager"
          # ohne AddOns-Ordner: sauberer Exit mit Code 1, kein Absturz
          rc=0; ./dist/wow-forever-addon-manager --check || rc=$?
          test "$rc" -eq 1

      - name: Package
        run: |
          cp dist/wow-forever-addon-manager wow-forever-addon-manager-x86_64-linux
          chmod +x wow-forever-addon-manager-x86_64-linux

      - uses: actions/upload-artifact@v4
        with:
          name: binary
          path: wow-forever-addon-manager-x86_64-linux

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          # bubblewrap braucht unprivilegierte User-Namespaces (unter Ubuntu 24.04 per AppArmor gesperrt)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Validate metadata
        run: |
          desktop-file-validate packaging/io.github.m3rtl.WowForeverAddonManager.desktop
          appstreamcli validate --no-net packaging/io.github.m3rtl.WowForeverAddonManager.metainfo.xml

      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --repo=repo --force-clean build-flatpak \
            packaging/flatpak/io.github.m3rtl.WowForeverAddonManager.yml
          flatpak build-bundle repo wow-forever-addon-manager-x86_64.flatpak io.github.m3rtl.WowForeverAddonManager \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Smoke test
        run: |
          flatpak-builder --run build-flatpak packaging/flatpak/io.github.m3rtl.WowForeverAddonManager.yml \
            wow-forever-addon-manager --version

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: wow-forever-addon-manager-x86_64.flatpak

  release:
    needs: [build, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release-Text = Abschnitt der Version aus CHANGELOG.md (Fallback: automatisch erzeugte Notizen)
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## /{p = (index($0, "## " v " ") == 1)} p' CHANGELOG.md | tail -n +2 > notes.md
          chmod +x wow-forever-addon-manager-x86_64-linux
          sha256sum wow-forever-addon-manager-x86_64-linux wow-forever-addon-manager-x86_64.flatpak > SHA256SUMS
          if [ -s notes.md ]; then
            printf '\nPrüfen: `sha256sum -c SHA256SUMS`\n' >> notes.md
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" "${notes[@]}" \
            wow-forever-addon-manager-x86_64-linux wow-forever-addon-manager-x86_64.flatpak SHA256SUMS
